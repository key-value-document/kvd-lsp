# Publish kvd-lsp to crates.io on tagged releases.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    # Pinned while ubuntu-latest migrates to 26.04.
    # https://github.com/actions/runner-images/issues/14748
    runs-on: ubuntu-26.04
    container:
      image: rust:1-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish kvd-lsp
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
